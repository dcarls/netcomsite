<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netcom - Internet Fibra Óptica</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&family=Montserrat:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="background"></div>

    <div class="container">
        <header>
            <div class="header-content">
                <img src="logo.png" alt="Netcom Logo" class="logo-img">
                <div class="welcome-container">
                    <h1>SEJA BEM-VINDO</h1>
                    <div class="red-border-animation"></div>
                </div>
            </div>
        </header>

        <main>
            <div class="destaque-fibra">INTERNET FIBRA ÓPTICA</div>
            
            <div class="cta-box">
                <div class="arrow-animation">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="simple-arrow">
                        <path fill="#ff0000" d="M12 2L10.59 3.41 17.17 10H2v2h15.17l-6.58 6.59L12 22l10-10z"/>
                    </svg>
                </div>
                <div class="cta-text">ASSINE JÁ</div>
            </div>
            
            <div class="contact-info">
                <div class="phone">
                    <i class="fab fa-whatsapp"></i>
                    <span>88 99744-0700</span>
                </div>
                <div class="instagram">
                    <i class="fab fa-instagram"></i>
                    <span>@provedor.netcom</span>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
